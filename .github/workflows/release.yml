name: Package ForeverLoot

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build addon zip
        shell: bash
        run: |
          mkdir -p package/ForeverLoot
          cp ForeverLoot.toc *.lua README.md LICENSE package/ForeverLoot/
          cd package
          zip -r "../ForeverLoot-${GITHUB_REF_NAME}.zip" ForeverLoot

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "ForeverLoot-${GITHUB_REF_NAME}.zip" \
            --generate-notes \
            --title "ForeverLoot ${GITHUB_REF_NAME}"
